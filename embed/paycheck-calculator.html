<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paycheck Calculator — PopPopMake</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EF; --paper-2:#E4E9E6; --ink:#1C2321; --ink-soft:#4B534F;
    --orange:#C14324; --teal:#0D7A7C; --yellow:#F4B740; --card:#FFFFFF;
    --line:rgba(28,35,33,0.12); --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:transparent;color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal);}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .embed{padding:14px;max-width:480px;margin:0 auto;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:5px;}
  input[type=number], select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:0.95rem;background:#fff;color:var(--ink);
  }
  .salary-wrap{position:relative;}
  .salary-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:0.95rem;}
  .salary-wrap input{padding-left:20px;}
  .hint{font-size:0.72rem;color:var(--ink-soft);margin-top:4px;}

  .take-home{
    background:var(--card);border:1px solid var(--line);border-top:3px solid var(--orange);
    border-radius:var(--radius);padding:16px;margin-bottom:10px;text-align:center;
  }
  .take-home h2{font-family:'Space Grotesk',sans-serif;font-size:0.85rem;margin:0 0 4px;font-weight:600;color:var(--ink-soft);}
  .take-home .amount{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2rem;color:var(--orange);letter-spacing:-0.02em;}
  .take-home .sub{color:var(--ink-soft);font-size:0.82rem;}

  table.breakdown{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:0.82rem;}
  table.breakdown th, table.breakdown td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);}
  table.breakdown th:first-child, table.breakdown td:first-child{text-align:left;}
  table.breakdown thead th{
    font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-soft);
    background:var(--paper-2);
  }
  table.breakdown tbody tr:last-child td{border-bottom:none;}
  table.breakdown tr.net td{font-weight:700;background:rgba(15,139,141,0.06);}
  table.breakdown .neg{color:var(--orange);}

  .rate-strip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rate-strip .chip{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink-soft);
  }
  .rate-strip .chip b{color:var(--ink);}

  .fine-print{font-size:0.68rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;}

  .badge{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 2px;font-size:0.76rem;color:var(--ink-soft);}
  .badge a{color:var(--ink);text-decoration:none;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .badge a:hover{color:var(--teal);}
</style>
</head>

    if (s.stdDed) base = Math.max(0, base - s.stdDed[status]);
    if (s.exemption) base = Math.max(0, base - s.exemption[status]);
    if (s.extra) base = Math.max(0, base - s.extra[status]);
    var tax;
    if (s.brackets) {
      tax = pt(base, s.brackets[status]);
    } else {
      var taxableForRate = s.zeroBracket ? Math.max(0, base - s.zeroBracket) : base;
      tax = taxableForRate * s.rate;
    }
    if (s.credit) tax -= s.credit[status];
    if (s.surchargeThreshold && base > s.surchargeThreshold) tax += (base - s.surchargeThreshold) * s.surchargeRate;
    tax = Math.max(0, tax);
    var addon = 0;
    if (s.addon) {
      var abase = s.addon.cap ? Math.min(gross, s.addon.cap) : gross;
      addon = abase * s.addon.rate;
    }
    return { tax: tax, addon: addon, hint: s.name + ' state income tax' + (s.addon ? ', plus ' + s.addon.short : '') + '.' };
  }

  function marginalRateOf(income, brackets){
    var rate = brackets[0][2];
    for (var i=0;i<brackets.length;i++){
      if (income > brackets[i][0]) rate = brackets[i][2];
    }
    return rate;
  }

  function populateStates(){
    var sel = document.getElementById('state');
    sel.innerHTML = '';
    var codes = Object.keys(STATES).sort(function(a,b){
      return STATES[a].name.localeCompare(STATES[b].name);
    });
    codes.forEach(function(code){
      var opt = document.createElement('option');
      opt.value = code; opt.textContent = STATES[code].name;
      sel.appendChild(opt);
    });
    sel.value = 'TX';
  }

  function calc(){
    var gross = Math.max(0, parseFloat(document.getElementById('salary').value) || 0);
    var status = document.getElementById('filingStatus').value;
    var stateCode = document.getElementById('state').value;
    var periods = parseInt(document.getElementById('frequency').value, 10);

    var fedStd = FEDERAL_STD_DEDUCTION[status];
    var fedTaxable = Math.max(0, gross - fedStd);
    var fedTax = pt(fedTaxable, FEDERAL_BRACKETS[status]);
    var marginal = marginalRateOf(fedTaxable, FEDERAL_BRACKETS[status]);

    var ssTax = Math.min(gross, SS_WAGE_BASE) * SS_RATE;
    var medicareTax = gross * MEDICARE_RATE;
    var addlMedicare = Math.max(0, gross - ADDL_MEDICARE_THRESHOLD[status]) * ADDL_MEDICARE_RATE;
    var ficaTotal = ssTax + medicareTax + addlMedicare;

    var st = calcState(stateCode, gross, status, fedTaxable);
    document.getElementById('stateHint').textContent = st.hint;

    var stateTotal = st.tax + st.addon;
    var totalTax = fedTax + ficaTotal + stateTotal;
    var netAnnual = gross - totalTax;
    var effRate = gross > 0 ? (totalTax/gross*100) : 0;

    document.getElementById('netPerPeriod').textContent = fmt(netAnnual/periods);
    document.getElementById('netAnnualSub').textContent = fmt(netAnnual) + ' per year, after taxes';
    document.getElementById('effRate').textContent = effRate.toFixed(1) + '%';
    document.getElementById('marginalRate').textContent = (marginal*100).toFixed(0) + '%';

    var rows = [
      ['Gross pay', gross, gross/periods, false],
      ['Federal income tax', -fedTax, -fedTax/periods, true],
      ['Social Security (6.2%)', -ssTax, -ssTax/periods, true],
      ['Medicare (1.45%)', -medicareTax, -medicareTax/periods, true]
    ];
    if (addlMedicare > 0) rows.push(['Additional Medicare (0.9%)', -addlMedicare, -addlMedicare/periods, true]);
    if (st.tax > 0 || STATES[stateCode].type !== 'none') rows.push([STATES[stateCode].name+' state tax', -st.tax, -st.tax/periods, true]);
    if (st.addon > 0) rows.push([STATES[stateCode].addon ? STATES[stateCode].addon.label : (STATES[stateCode].name+' payroll addon'), -st.addon, -st.addon/periods, true]);
    rows.push(['Take-home pay', netAnnual, netAnnual/periods, false]);

    var body = document.getElementById('breakdownBody');
    body.innerHTML = '';
    rows.forEach(function(r, idx){
      var tr = document.createElement('tr');
      if (idx === rows.length-1) tr.className = 'net';
      var cls = r[3] ? 'neg' : '';
      tr.innerHTML = '<td>'+r[0]+'</td><td class="'+cls+'">'+fmt(r[1])+'</td><td class="'+cls+'">'+fmt(r[2])+'</td>';
      body.appendChild(tr);
    });
  }

  function fmt(n){
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits:0});
  }

  var _params = new URLSearchParams(window.location.search);
  var _instanceId = _params.get('instance') || '';

  function sendHeight(){
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({type:'poppopmake-embed-resize', instance:_instanceId, height:h}, '*');
  }

  populateStates();
  ['salary','filingStatus','state','frequency'].forEach(function(id){
    document.getElementById(id).addEventListener('input', calc);
    document.getElementById(id).addEventListener('change', calc);
  });
  calc();

  window.addEventListener('load', sendHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(sendHeight).observe(document.body);
  } else {
    setTimeout(sendHeight, 300);
  }
})();
</script>
</body>
</html>
