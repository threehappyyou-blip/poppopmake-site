<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDFs — PopPopMake</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EF; --paper-2:#E4E9E6; --ink:#1C2321; --ink-soft:#4B534F;
    --orange:#C14324; --teal:#0D7A7C; --yellow:#F4B740; --card:#FFFFFF;
    --line:rgba(28,35,33,0.12); --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:transparent;color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .embed{padding:14px;max-width:440px;margin:0 auto;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}

  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px 14px;text-align:center;cursor:pointer;font-size:0.85rem;color:var(--ink-soft);}
  .drop:hover, .drop.dragover{border-color:var(--teal);background:rgba(15,139,141,0.05);}
  .drop .btn-label{display:inline-block;margin-top:6px;background:var(--ink);color:#fff;font-weight:600;font-size:0.82rem;padding:8px 16px;border-radius:999px;cursor:pointer;}
  .drop input[type=file]{display:none;}
  .drop .hint{font-size:0.7rem;margin-top:6px;}

  .file-list{list-style:none;padding:0;margin:12px 0 0;}
  .file-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.8rem;}
  .file-list li:last-child{border-bottom:none;}
  .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fmeta{color:var(--ink-soft);font-size:0.72rem;flex-shrink:0;}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:6px;width:24px;height:24px;cursor:pointer;color:var(--ink-soft);flex-shrink:0;font-size:0.8rem;}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}

  .action-btn{width:100%;background:var(--orange);color:#fff;border:none;font-weight:600;font-size:0.9rem;padding:10px 16px;border-radius:999px;cursor:pointer;margin-top:12px;}
  .action-btn:hover:not(:disabled){opacity:0.92;}
  .action-btn:disabled{background:var(--paper-2);color:var(--ink-soft);cursor:not-allowed;}

  .status{margin-top:10px;font-size:0.8rem;padding:9px 12px;border-radius:8px;display:none;}
  .status.show{display:block;}
  .status.success{background:rgba(15,139,141,0.1);color:var(--ink);}
  .status.error{background:rgba(242,84,45,0.08);color:var(--orange);}
  .status.info{background:var(--paper-2);color:var(--ink-soft);}

  .fine-print{font-size:0.68rem;color:var(--ink-soft);margin-top:10px;text-align:center;}
  .badge{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 2px;font-size:0.76rem;color:var(--ink-soft);}
  .badge a{color:var(--ink);text-decoration:none;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .badge a:hover{color:var(--teal);}
</style>
</head>
<body>

<div class="embed">
  <div class="panel">
    <div class="drop" id="merge-drop">
      <div>Drag PDFs here, or</div>
      <label class="btn-label" for="merge-input">Choose PDF files</label>
      <div class="hint">Select 2 or more</div>
      <input type="file" id="merge-input" accept="application/pdf" multiple>
    </div>
    <ul class="file-list" id="merge-list"></ul>
    <button class="action-btn" id="merge-btn" disabled>Merge PDFs</button>
    <div class="status" id="merge-status"></div>
  </div>

  <p class="fine-print">Runs in this frame only — your files are never uploaded anywhere.</p>

  <div class="badge">
    <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1C2321"/><circle cx="32" cy="24" r="11" fill="#F2542D"/><circle cx="18" cy="44" r="7" fill="#0F8B8D"/><circle cx="46" cy="44" r="7" fill="#F4B740"/></svg>
    <span>Powered by <a href="https://poppopmake.com/document-tools.html" target="_blank" rel="noopener">PopPopMake</a></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var instanceId = params.get('instance') || '';

  function sendHeight(){
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({type:'poppopmake-embed-resize', instance:instanceId, height:h}, '*');
  }

  function readAsUint8Array(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(new Uint8Array(reader.result)); };
      reader.onerror = function(){ reject(new Error('Could not read ' + file.name)); };
      reader.readAsArrayBuffer(file);
    });
  }
  function fmtSize(bytes){
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }
  function downloadBlob(bytes, filename, mime){
    var blob = new Blob([bytes], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
  function setStatus(el, kind, msg){
    el.className = 'status show ' + kind;
    el.textContent = msg;
  }
  function clearStatus(el){
    el.className = 'status';
    el.textContent = '';
  }
  function setupDrop(dropEl, inputEl, onFiles){
    dropEl.addEventListener('click', function(e){ if (e.target.tagName !== 'LABEL') inputEl.click(); });
    dropEl.addEventListener('dragover', function(e){ e.preventDefault(); dropEl.classList.add('dragover'); });
    dropEl.addEventListener('dragleave', function(){ dropEl.classList.remove('dragover'); });
    dropEl.addEventListener('drop', function(e){
      e.preventDefault(); dropEl.classList.remove('dragover');
      if (e.dataTransfer.files.length) onFiles(Array.from(e.dataTransfer.files));
    });
    inputEl.addEventListener('change', function(){
      if (inputEl.files.length) onFiles(Array.from(inputEl.files));
      inputEl.value = '';
    });
  }

  // ================= MERGE =================
  var mergeFiles = [];
  var mergeList = document.getElementById('merge-list');
  var mergeBtn = document.getElementById('merge-btn');
  var mergeStatus = document.getElementById('merge-status');

  function renderMergeList(){
    mergeList.innerHTML = '';
    mergeFiles.forEach(function(f, idx){
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="fname">' + f.name + '</span>' +
        '<span class="fmeta">' + fmtSize(f.size) + '</span>' +
        '<button class="icon-btn" data-act="up" title="Move up" aria-label="Move up">&uarr;</button>' +
        '<button class="icon-btn" data-act="down" title="Move down" aria-label="Move down">&darr;</button>' +
        '<button class="icon-btn" data-act="remove" title="Remove" aria-label="Remove">&times;</button>';
      li.querySelector('[data-act=up]').addEventListener('click', function(){
        if (idx > 0){ var t = mergeFiles[idx-1]; mergeFiles[idx-1] = mergeFiles[idx]; mergeFiles[idx] = t; renderMergeList(); }
      });
      li.querySelector('[data-act=down]').addEventListener('click', function(){
        if (idx < mergeFiles.length-1){ var t = mergeFiles[idx+1]; mergeFiles[idx+1] = mergeFiles[idx]; mergeFiles[idx] = t; renderMergeList(); }
      });
      li.querySelector('[data-act=remove]').addEventListener('click', function(){
        mergeFiles.splice(idx, 1); renderMergeList();
      });
      mergeList.appendChild(li);
    });
    mergeBtn.disabled = mergeFiles.length < 2;
    clearStatus(mergeStatus);
  }

  setupDrop(document.getElementById('merge-drop'), document.getElementById('merge-input'), function(files){
    files.filter(function(f){ return f.type === 'application/pdf' || /\.pdf$/i.test(f.name); })
         .forEach(function(f){ mergeFiles.push(f); });
    renderMergeList();
  });

  mergeBtn.addEventListener('click', function(){
    mergeBtn.disabled = true;
    setStatus(mergeStatus, 'info', 'Merging ' + mergeFiles.length + ' files\u2026');
    (async function(){
      try {
        var outDoc = await PDFDocument.create();
        for (var i = 0; i < mergeFiles.length; i++){
          var bytes = await readAsUint8Array(mergeFiles[i]);
          var srcDoc = await PDFDocument.load(bytes, { ignoreEncryption: true });
          var pages = await outDoc.copyPages(srcDoc, srcDoc.getPageIndices());
          pages.forEach(function(p){ outDoc.addPage(p); });
        }
        var outBytes = await outDoc.save();
        downloadBlob(outBytes, 'merged.pdf', 'application/pdf');
        setStatus(mergeStatus, 'success', 'Done. Your merged PDF (' + outDoc.getPageCount() + ' pages) has started downloading.');
      } catch(err){
        setStatus(mergeStatus, 'error', 'Could not merge these files: ' + err.message + '. Make sure each one is a valid, non-corrupted PDF.');
      }
      mergeBtn.disabled = mergeFiles.length < 2;
    })();
  });


  window.addEventListener('load', sendHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(sendHeight).observe(document.body);
  } else {
    setTimeout(sendHeight, 300);
  }
})();
</script>
</body>
</html>
