<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canada Paycheck Calculator — PopPopMake</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EF; --paper-2:#E4E9E6; --ink:#1C2321; --ink-soft:#4B534F;
    --orange:#C14324; --teal:#0D7A7C; --yellow:#F4B740; --card:#FFFFFF;
    --line:rgba(28,35,33,0.12); --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:transparent;color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal);}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .embed{padding:14px;max-width:480px;margin:0 auto;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:5px;}
  input[type=number], select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:0.95rem;background:#fff;color:var(--ink);
  }
  .salary-wrap{position:relative;}
  .salary-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:0.95rem;}
  .salary-wrap input{padding-left:20px;}

  .take-home{
    background:var(--card);border:1px solid var(--line);border-top:3px solid var(--orange);
    border-radius:var(--radius);padding:16px;margin-bottom:10px;text-align:center;
  }
  .take-home h2{font-family:'Space Grotesk',sans-serif;font-size:0.85rem;margin:0 0 4px;font-weight:600;color:var(--ink-soft);}
  .take-home .amount{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2rem;color:var(--orange);letter-spacing:-0.02em;}
  .take-home .sub{color:var(--ink-soft);font-size:0.82rem;}

  table.breakdown{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:0.82rem;}
  table.breakdown th, table.breakdown td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);}
  table.breakdown th:first-child, table.breakdown td:first-child{text-align:left;}
  table.breakdown thead th{
    font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-soft);
    background:var(--paper-2);
  }
  table.breakdown tbody tr:last-child td{border-bottom:none;}
  table.breakdown tr.net td{font-weight:700;background:rgba(15,139,141,0.06);}
  table.breakdown .neg{color:var(--orange);}

  .rate-strip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rate-strip .chip{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink-soft);
  }
  .rate-strip .chip b{color:var(--ink);}

  .fine-print{font-size:0.68rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;}

  .badge{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 2px;font-size:0.76rem;color:var(--ink-soft);}
  .badge a{color:var(--ink);text-decoration:none;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .badge a:hover{color:var(--teal);}
</style>
</head>
<body>

<div class="embed">
  <div class="panel">
    <div class="field">
      <label for="salary">Annual salary</label>
      <div class="salary-wrap">
        <span>$</span>
        <input type="number" id="salary" value="70000" min="0" step="500">
      </div>
    </div>
    <div class="field">
      <label for="province">Province / territory</label>
      <select id="province">
        <option value="AB">Alberta</option>
        <option value="BC">British Columbia</option>
        <option value="MB">Manitoba</option>
        <option value="NB">New Brunswick</option>
        <option value="NL">Newfoundland and Labrador</option>
        <option value="NS">Nova Scotia</option>
        <option value="NT">Northwest Territories</option>
        <option value="NU">Nunavut</option>
        <option value="ON" selected>Ontario</option>
        <option value="PE">Prince Edward Island</option>
        <option value="QC">Quebec</option>
        <option value="SK">Saskatchewan</option>
        <option value="YT">Yukon</option>
      </select>
    </div>
    <div class="field">
      <label for="frequency">Pay frequency</label>
      <select id="frequency">
        <option value="52">Weekly</option>
        <option value="26" selected>Biweekly</option>
        <option value="12">Monthly</option>
        <option value="1">Annual</option>
      </select>
    </div>
  </div>

  <div class="take-home">
    <h2>Take-home pay per paycheque</h2>
    <div class="amount" id="netPerPeriod">$0</div>
    <div class="sub" id="netAnnualSub"></div>
  </div>

  <table class="breakdown">
    <thead><tr><th>Item</th><th>Per year</th><th>Per paycheque</th></tr></thead>
    <tbody id="breakdownBody"></tbody>
  </table>

  <div class="rate-strip">
    <span class="chip">Effective rate: <b id="effRate">0%</b></span>
  </div>

  <p class="fine-print">Estimate only, not tax advice — 2026 federal + provincial tax, CPP/CPP2, EI. Runs entirely in this frame; nothing you enter is sent anywhere.</p>

  <div class="badge">
    <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1C2321"/><circle cx="32" cy="24" r="11" fill="#F2542D"/><circle cx="18" cy="44" r="7" fill="#0F8B8D"/><circle cx="46" cy="44" r="7" fill="#F4B740"/></svg>
    <span>Powered by <a href="https://poppopmake.com/ca-paycheck-calculator.html" target="_blank" rel="noopener">PopPopMake</a></span>
  </div>
</div>

<script>
(function(){
function pt(income, brackets){
  if (income <= 0) return 0;
  var tax = 0;
  for (var i=0;i<brackets.length;i++){
    var lo=brackets[i][0], hi=brackets[i][1], rate=brackets[i][2];
    if (income > lo){ tax += (Math.min(income,hi)-lo)*rate; } else { break; }
  }
  return tax;
}

// ---- Federal 2026 (CRA, verified 2026-08-25) ----
var FED_BRACKETS = [[0,58523,0.14],[58523,117045,0.205],[117045,181440,0.26],[181440,258482,0.29],[258482,Infinity,0.33]];
var BPA_MAX = 16452, BPA_MIN = 14829, BPA_PHASE_START = 181440, BPA_PHASE_END = 258482;
var BPA_CREDIT_RATE = 0.14; // lowest federal bracket rate

function federalBPA(income){
  if (income <= BPA_PHASE_START) return BPA_MAX;
  if (income >= BPA_PHASE_END) return BPA_MIN;
  var frac = (income - BPA_PHASE_START) / (BPA_PHASE_END - BPA_PHASE_START);
  return BPA_MAX - (BPA_MAX - BPA_MIN) * frac;
}

function federalTax(income, isQuebec){
  var gross = pt(income, FED_BRACKETS);
  var credit = federalBPA(income) * BPA_CREDIT_RATE;
  var tax = Math.max(0, gross - credit);
  if (isQuebec) tax = tax * (1 - 0.165); // Quebec federal abatement
  return tax;
}

// ---- Provinces/territories 2026 (CRA + Revenu Quebec, verified 2026-08-25) ----
var PROVINCES = {
  AB: { name:"Alberta", brackets:[[0,61200,0.08],[61200,154259,0.10],[154259,185111,0.12],[185111,246813,0.13],[246813,370220,0.14],[370220,Infinity,0.15]] },
  BC: { name:"British Columbia", brackets:[[0,50363,0.056],[50363,100728,0.077],[100728,115648,0.105],[115648,140430,0.1229],[140430,190405,0.147],[190405,265545,0.168],[265545,Infinity,0.205]] },
  MB: { name:"Manitoba", brackets:[[0,47564,0.108],[47564,101200,0.1275],[101200,Infinity,0.174]] },
  NB: { name:"New Brunswick", brackets:[[0,52333,0.094],[52333,104666,0.14],[104666,193861,0.16],[193861,Infinity,0.195]] },
  NL: { name:"Newfoundland and Labrador", brackets:[[0,44678,0.087],[44678,89354,0.145],[89354,159528,0.158],[159528,223340,0.178],[223340,285319,0.198],[285319,570638,0.208],[570638,1141275,0.213],[1141275,Infinity,0.218]] },
  NS: { name:"Nova Scotia", brackets:[[0,30995,0.0879],[30995,61991,0.1495],[61991,97417,0.1667],[97417,157124,0.175],[157124,Infinity,0.21]] },
  NT: { name:"Northwest Territories", brackets:[[0,53003,0.059],[53003,106009,0.086],[106009,172346,0.122],[172346,Infinity,0.1405]] },
  NU: { name:"Nunavut", brackets:[[0,55801,0.04],[55801,111602,0.07],[111602,181439,0.09],[181439,Infinity,0.115]] },
  ON: { name:"Ontario", brackets:[[0,53891,0.0505],[53891,107785,0.0915],[107785,150000,0.1116],[150000,220000,0.1216],[220000,Infinity,0.1316]], surtax:[[5818,0.20],[7446,0.36]] },
  PE: { name:"Prince Edward Island", brackets:[[0,33928,0.095],[33928,65820,0.1347],[65820,106890,0.166],[106890,142520,0.1762],[142520,200000,0.19],[200000,Infinity,0.20]] },
  QC: { name:"Quebec", brackets:[[0,54345,0.14],[54345,108680,0.19],[108680,132245,0.24],[132245,Infinity,0.2575]] },
  SK: { name:"Saskatchewan", brackets:[[0,54532,0.105],[54532,155805,0.125],[155805,Infinity,0.145]] },
  YT: { name:"Yukon", brackets:[[0,58523,0.064],[58523,117045,0.09],[117045,181440,0.109],[181440,500000,0.128],[500000,Infinity,0.15]] }
};

function provincialTax(code, income){
  var p = PROVINCES[code];
  var basicTax = pt(income, p.brackets);
  var tax = basicTax;
  if (p.surtax){
    p.surtax.forEach(function(tier){
      if (basicTax > tier[0]) tax += (basicTax - tier[0]) * tier[1];
    });
  }
  return tax;
}

// ---- CPP / CPP2 / EI 2026 (CRA, verified 2026-08-25) ----
var CPP_EXEMPT = 3500, CPP_YMPE = 74600, CPP_RATE = 0.0595;
var CPP2_YAMPE = 85000, CPP2_RATE = 0.04;
var EI_MIE = 68900, EI_RATE = 0.0163, EI_RATE_QC = 0.0130;

function calcCPP(income){
  var base = Math.max(0, Math.min(income, CPP_YMPE) - CPP_EXEMPT) * CPP_RATE;
  var cpp2 = Math.max(0, Math.min(income, CPP2_YAMPE) - CPP_YMPE) * CPP2_RATE;
  return { base: base, cpp2: cpp2, total: base + cpp2 };
}

function calcEI(income, isQuebec){
  var rate = isQuebec ? EI_RATE_QC : EI_RATE;
  return Math.min(income, EI_MIE) * rate;
}

function calcCanadaTax(gross, provinceCode){
  var isQC = provinceCode === 'QC';
  var fed = federalTax(gross, isQC);
  var prov = provincialTax(provinceCode, gross);
  var cpp = calcCPP(gross);
  var ei = calcEI(gross, isQC);
  var totalDeductions = fed + prov + cpp.total + ei;
  return {
    federal: fed, provincial: prov, cpp: cpp.base, cpp2: cpp.cpp2, ei: ei,
    totalDeductions: totalDeductions, net: gross - totalDeductions
  };
}


  function fmt(n){
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-CA', {maximumFractionDigits:0});
  }

  function calc(){
    var gross = Math.max(0, parseFloat(document.getElementById('salary').value) || 0);
    var provinceCode = document.getElementById('province').value;
    var periods = parseInt(document.getElementById('frequency').value, 10);

    var r = calcCanadaTax(gross, provinceCode);
    var netAnnual = gross - r.totalDeductions;
    var effRate = gross > 0 ? (r.totalDeductions/gross*100) : 0;

    document.getElementById('netPerPeriod').textContent = fmt(netAnnual/periods);
    document.getElementById('netAnnualSub').textContent = fmt(netAnnual) + ' per year, after all deductions';
    document.getElementById('effRate').textContent = effRate.toFixed(1) + '%';

    var rows = [
      ['Gross pay', gross, gross/periods, false],
      ['Federal tax', -r.federal, -r.federal/periods, true],
      [PROVINCES[provinceCode].name + ' tax', -r.provincial, -r.provincial/periods, true],
      ['CPP', -r.cpp, -r.cpp/periods, true]
    ];
    if (r.cpp2 > 0) rows.push(['CPP2', -r.cpp2, -r.cpp2/periods, true]);
    rows.push(['EI', -r.ei, -r.ei/periods, true]);
    rows.push(['Take-home pay', netAnnual, netAnnual/periods, false]);

    var body = document.getElementById('breakdownBody');
    body.innerHTML = '';
    rows.forEach(function(row, idx){
      var tr = document.createElement('tr');
      if (idx === rows.length-1) tr.className = 'net';
      var cls = row[3] ? 'neg' : '';
      tr.innerHTML = '<td>'+row[0]+'</td><td class="'+cls+'">'+fmt(row[1])+'</td><td class="'+cls+'">'+fmt(row[2])+'</td>';
      body.appendChild(tr);
    });
  }

  ['salary','province','frequency'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ calc(); if (window.ppmMaybeShowThanks) window.ppmMaybeShowThanks(); });
    document.getElementById(id).addEventListener('change', function(){ calc(); if (window.ppmMaybeShowThanks) window.ppmMaybeShowThanks(); });
  });
  calc();
  var _params = new URLSearchParams(window.location.search);
  var _instanceId = _params.get('instance') || '';

  function sendHeightEmbed(){
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({type:'poppopmake-embed-resize', instance:_instanceId, height:h}, '*');
  }
  window.addEventListener('load', sendHeightEmbed);
  if (window.ResizeObserver) {
    new ResizeObserver(sendHeightEmbed).observe(document.body);
  } else {
    setTimeout(sendHeightEmbed, 300);
  }
})();
</script>
</body>
</html>
